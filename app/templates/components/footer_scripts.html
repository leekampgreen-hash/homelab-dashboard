<script>
const refreshInterval = 30;
let secondsUntilRefresh = refreshInterval;
let statusFilter = "all";
let selectedPowerAction = null;
const snapshotApi = {
    listVms: () => fetchJson("/api/vm"),
    list: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots`),
    create: (vmId, payload) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }),
    restore: (vmId, snapshotId) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots/${encodeURIComponent(snapshotId)}/restore`, { method: "POST" }),
    remove: (vmId, snapshotId) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots/${encodeURIComponent(snapshotId)}`, { method: "DELETE" })
};

const vmActionApi = {
    powerOn: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/poweron`, { method: "POST" }),
    powerOff: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/poweroff`, { method: "POST" }),
    reset: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/reset`, { method: "POST" }),
    shutdown: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/shutdown`, { method: "POST" }),
    suspend: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/suspend`, { method: "POST" })
};

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "VMware request failed");
    return data;
}

function showTaskToast(message, type = "info", progress = null) {
    const toast = document.createElement("div");
    toast.className = `toast align-items-center text-bg-${type} border-0`;
    toast.setAttribute("role", "alert");
    const progressText = progress === null ? "" : ` (${progress}%)`;
    const spinner = type === "info" ? '<span class="spinner-border spinner-border-sm me-2" role="status"></span>' : "";
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${spinner}${message}${progressText}</div>` +
        `<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    document.getElementById("taskToastContainer").appendChild(toast);
    const instance = new bootstrap.Toast(toast, { delay: type === "info" ? 2500 : 5000 });
    instance.show();
    toast.addEventListener("hidden.bs.toast", () => toast.remove());
}

async function pollVmwareTask(taskId) {
    showTaskToast("VMware action running...", "info");
    while (true) {
        const result = await fetchJson(`/api/tasks/${encodeURIComponent(taskId)}`);
        const task = result.data;
        if (task.state === "success") {
            showTaskToast("VMware action completed", "success", task.progress);
            return task;
        }
        if (task.state === "error") {
            showTaskToast(task.error || "VMware action failed", "danger");
            throw new Error(task.error || "VMware action failed");
        }
        showTaskToast(`VMware action ${task.state}`, "info", task.progress);
        await new Promise(resolve => setTimeout(resolve, 2000));
    }
}

async function runTaskAction(action) {
    const response = await action();
    const taskId = response.task_id || response.task;
    if (!taskId) throw new Error("VMware task ID was not returned");
    return pollVmwareTask(taskId);
}

const powerConfirmModal = new bootstrap.Modal(
    document.getElementById("powerConfirmModal")
);

function updateRefreshCountdown() {
    document.getElementById("refresh-countdown").innerText =
        `${secondsUntilRefresh}s`;
}

function getStatusBadgeClass(status) {
    if (status.includes("Running")) return "bg-success";
    if (status.includes("Stopped") || status.includes("Powered Off")) return "bg-danger";
    if (status.includes("Suspended")) return "bg-warning text-dark";
    return "bg-secondary";
}

function getPowerActions(powerState) {
    if (powerState === "poweredOn") {
        return [
            { action: "stop", label: "Stop", className: "btn-danger" },
            { action: "restart", label: "Restart", className: "btn-warning" }
        ];
    }
    if (powerState === "poweredOff") {
        return [{ action: "start", label: "Start", className: "btn-success" }];
    }
    return [];
}

function renderVmActions() {
    document.querySelectorAll(".vm-actions").forEach(container => {
        const vmId = container.dataset.vmId;
        container.innerHTML = `<div class="dropdown"><button class="btn btn-sm btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">Action</button>` +
            `<ul class="dropdown-menu"><li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="powerOn">Power On</button></li>` +
            `<li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="powerOff">Power Off</button></li>` +
            `<li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="reset">Reset</button></li>` +
            `<li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="shutdown">Shutdown Guest</button></li>` +
            `<li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="suspend">Suspend</button></li>` +
            `<li><button class="dropdown-item" data-vm-id="${vmId}" data-vm-action="snapshot">Snapshot</button></li></ul></div>`;
    });
}

function filterVmRows() {
    const query = document.getElementById("vm-search").value.toLowerCase();
    document.querySelectorAll("#vm-table tr").forEach(row => {
        const name = row.cells[0].innerText.toLowerCase();
        const status = row.cells[1].innerText;
        const matchesStatus = statusFilter === "all" ||
            (statusFilter === "running" && status.includes("Running")) ||
            (statusFilter === "stopped" &&
                (status.includes("Stopped") || status.includes("Powered Off")));
        row.style.display = name.includes(query) && matchesStatus ? "" : "none";
    });
}

function setActiveVmFilterCard(activeCard) {
    document.querySelectorAll("[data-vm-filter]").forEach(card => {
        card.classList.remove("border-primary", "border-2", "shadow-sm");
    });
    activeCard.classList.add("border-primary", "border-2", "shadow-sm");
}

function updateVmStatusSummary() {
    const rows = document.querySelectorAll("#vm-table tr");
    const running = Array.from(rows).filter(row =>
        row.cells[1].innerText.includes("Running")
    ).length;
    document.getElementById("vm-total").innerText = rows.length;
    document.getElementById("vm-running").innerText = running;
    document.getElementById("vm-stopped").innerText = rows.length - running;
}

function renderVmRows(vms) {
    const tableBody = document.getElementById("vm-table");
    tableBody.innerHTML = "";

    vms.forEach(vm => {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        const statusCell = document.createElement("td");
        const cpuCell = document.createElement("td");
        const memoryCell = document.createElement("td");
        const ipCell = document.createElement("td");
        const guestCell = document.createElement("td");
        const hostCell = document.createElement("td");
        const uptimeCell = document.createElement("td");
        const actionCell = document.createElement("td");
        const badge = document.createElement("span");
        const actionContainer = document.createElement("div");
        const memoryMb = Number(vm.memory);
        const memoryGb = memoryMb / 1024;

        nameCell.innerText = vm.name;
        badge.className = `badge ${getStatusBadgeClass(vm.status)}`;
        badge.innerText = vm.status;
        statusCell.appendChild(badge);

        cpuCell.innerText = vm.cpu && vm.cpu !== "--" ? `${vm.cpu} vCPU` : "--";
        memoryCell.innerText = Number.isFinite(memoryGb)
            ? `${Number.isInteger(memoryGb) ? memoryGb : memoryGb.toFixed(1)} GB`
            : "--";
        ipCell.innerText = vm.ip || "--";
        guestCell.innerText = vm.guest || "--";
        hostCell.innerText = vm.host || "--";
        uptimeCell.innerText = vm.uptime || "--";

        actionContainer.className = "vm-actions";
        actionContainer.dataset.vmId = vm.id;
        actionContainer.dataset.powerState = vm.power_state;
        actionCell.appendChild(actionContainer);

        row.append(
            nameCell,
            statusCell,
            cpuCell,
            memoryCell,
            ipCell,
            guestCell,
            hostCell,
            uptimeCell,
            actionCell
        );
        tableBody.appendChild(row);
    });

    renderVmActions();
    updateVmStatusSummary();
    filterVmRows();
}

function renderAlerts(alerts) {
    const alertCount = document.getElementById("alert-count");
    const alertList = document.getElementById("alert-list");
    const systemHealth = document.getElementById("system-health");
    const criticalAlerts = alerts.filter(alert => alert.severity === "critical");

    alertCount.innerText = alerts.length;
    alertList.innerHTML = "";

    if (alerts.length === 0) {
        alertCount.className = "badge text-bg-success";
        systemHealth.className = "badge text-bg-success";
        systemHealth.innerText = "🟢 System Health: Healthy (0 alerts)";
        const emptyMessage = document.createElement("span");
        emptyMessage.className = "text-success";
        emptyMessage.innerText = "No active alerts";
        alertList.appendChild(emptyMessage);
        return;
    }

    if (criticalAlerts.length > 0) {
        alertCount.className = "badge text-bg-danger";
        systemHealth.className = "badge text-bg-danger";
        systemHealth.innerText =
            `🔴 System Health: Critical (${alerts.length} alerts)`;
    } else {
        alertCount.className = "badge text-bg-warning";
        systemHealth.className = "badge text-bg-warning";
        systemHealth.innerText =
            `🟡 System Health: Warning (${alerts.length} alerts)`;
    }

    const list = document.createElement("div");
    list.className = "list-group list-group-flush";

    alerts.forEach(alert => {
        const item = document.createElement("div");
        const severity = document.createElement("span");
        const source = document.createElement("strong");

        item.className = "list-group-item px-0";
        severity.className = alert.severity === "critical"
            ? "badge text-bg-danger me-2"
            : "badge text-bg-warning me-2";
        severity.innerText = alert.severity;
        source.innerText = `${alert.source}: `;

        item.append(severity, source, alert.message);
        list.appendChild(item);
    });

    alertList.appendChild(list);
}

function updateDashboardValues(data) {
    document.getElementById("cpu").innerText = `${data.summary.cpu} %`;
    document.getElementById("memory").innerText = `${data.summary.memory} %`;
    document.getElementById("datastore").innerText = `${data.summary.datastore} %`;
    document.getElementById("last-refresh").innerText = data.updated.summary;
    if (data.hardware) {
        document.getElementById("power").innerText = `${data.hardware.power.watt} W`;
        document.getElementById("temp-cpu").innerText = `${data.hardware.temperature.cpu} °C`;
        document.getElementById("temp-ambient").innerText = `${data.hardware.temperature.ambient} °C`;
        document.getElementById("temp-storage").innerText = `${data.hardware.temperature.storage} °C`;
    }
}

async function refreshDashboard() {
    try {
        const response = await fetch("/api/dashboard");
        if (!response.ok) throw new Error("Dashboard refresh failed");
        const data = await response.json();
        updateDashboardValues(data);
        renderVmRows(data.vm);
        renderAlerts(data.alerts || []);
        secondsUntilRefresh = refreshInterval;
        updateRefreshCountdown();
    } catch (error) {
        console.error(error);
    }
}

async function executePowerAction() {
    if (!selectedPowerAction) return;
    const { vmId, action, button } = selectedPowerAction;
    button.disabled = true;
    try {
        await runTaskAction(() => vmActionApi[action](vmId));
        powerConfirmModal.hide();
        await refreshDashboard();
    } catch (error) {
        alert(error.message);
        button.disabled = false;
    }
}

document.getElementById("confirmPowerAction").addEventListener("click", executePowerAction);
document.getElementById("vm-table").addEventListener("click", event => {
    const button = event.target.closest("[data-vm-action]");
    if (!button) return;
    if (button.dataset.vmAction === "snapshot") {
        openSnapshotModal(button.dataset.vmId, button.closest("tr").cells[0].innerText);
        return;
    }
    selectedPowerAction = {
        vmId: button.dataset.vmId,
        action: button.dataset.vmAction,
        button
    };
    document.getElementById("powerConfirmMessage").innerText =
        `Are you sure you want to ${selectedPowerAction.action} this virtual machine?`;
    powerConfirmModal.show();
});

const snapshotModal = new bootstrap.Modal(document.getElementById("snapshotModal"));
let selectedSnapshotVm = null;

async function loadSnapshots() {
    const result = await snapshotApi.list(selectedSnapshotVm.id);
    const select = document.getElementById("snapshotList");
    select.innerHTML = "";
    if (!result.data.length) {
        select.innerHTML = '<option value="">No snapshots</option>';
    } else {
        result.data.forEach(snapshot => {
            const option = document.createElement("option");
            option.value = snapshot.id;
            option.innerText = `${snapshot.name} - ${snapshot.description || "No description"}`;
            select.appendChild(option);
        });
    }
    document.getElementById("snapshotMessage").innerText = `${result.data.length} snapshot(s)`;
}

async function openSnapshotModal(vmId, vmName) {
    selectedSnapshotVm = { id: vmId, name: vmName };
    document.getElementById("snapshotVmName").innerText = vmName;
    snapshotModal.show();
    try { await loadSnapshots(); } catch (error) { showTaskToast(error.message, "danger"); }
}

async function snapshotTask(operation) {
    try {
        const response = await operation();
        await pollVmwareTask(response.task_id);
        await loadSnapshots();
    } catch (error) { showTaskToast(error.message, "danger"); }
}

document.getElementById("createSnapshot").addEventListener("click", () => {
    let name = document.getElementById("snapshotName").value.trim();
    if (!name) {
        const now = new Date();
        const pad = value => String(value).padStart(2, "0");
        name = `Snapshot-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-` +
            `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }
    snapshotTask(() => snapshotApi.create(selectedSnapshotVm.id, { name }));
});
document.getElementById("restoreSnapshot").addEventListener("click", () => {
    const id = document.getElementById("snapshotList").value;
    if (id) snapshotTask(() => snapshotApi.restore(selectedSnapshotVm.id, id));
});
document.getElementById("deleteSnapshot").addEventListener("click", () => {
    const id = document.getElementById("snapshotList").value;
    if (id) snapshotTask(() => snapshotApi.remove(selectedSnapshotVm.id, id));
});
document.getElementById("vm-search").addEventListener("input", filterVmRows);
document.querySelectorAll("[data-vm-filter]").forEach(card => {
    card.addEventListener("click", () => {
        statusFilter = card.dataset.vmFilter;
        setActiveVmFilterCard(card);
        filterVmRows();
    });
});

setActiveVmFilterCard(document.querySelector('[data-vm-filter="all"]'));
renderVmActions();
updateVmStatusSummary();
updateRefreshCountdown();
refreshDashboard();
setInterval(() => {
    secondsUntilRefresh = Math.max(secondsUntilRefresh - 1, 0);
    updateRefreshCountdown();
}, 1000);
setInterval(refreshDashboard, refreshInterval * 1000);
</script>
