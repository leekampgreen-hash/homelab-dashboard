<script>
const refreshInterval = 30;
let secondsUntilRefresh = refreshInterval;
let statusFilter = "all";
let selectedPowerAction = null;
const snapshotApi = {
    listVms: () => fetchJson("/api/vm"),
    list: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots`),
    create: (vmId, payload) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }),
    restore: (vmId, snapshotId) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots/${encodeURIComponent(snapshotId)}/restore`, { method: "POST" }),
    remove: (vmId, snapshotId) => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/snapshots/${encodeURIComponent(snapshotId)}`, { method: "DELETE" })
};

const vmActionApi = {
    powerOn: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/poweron`, { method: "POST" }),
    powerOff: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/poweroff`, { method: "POST" }),
    reset: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/reset`, { method: "POST" }),
    shutdown: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/shutdown`, { method: "POST" }),
    suspend: vmId => fetchJson(`/api/vm/${encodeURIComponent(vmId)}/suspend`, { method: "POST" })
};

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "VMware request failed");
    return data;
}

function showTaskToast(message, type = "info", progress = null) {
    const toast = document.createElement("div");
    const content = document.createElement("div");
    const body = document.createElement("div");
    const closeButton = document.createElement("button");
    toast.className = `toast align-items-center text-bg-${type} border-0`;
    toast.setAttribute("role", "alert");
    content.className = "d-flex";
    body.className = "toast-body";
    if (type === "info") {
        const spinner = document.createElement("span");
        spinner.className = "spinner-border spinner-border-sm me-2";
        spinner.setAttribute("role", "status");
        body.appendChild(spinner);
    }
    body.append(`${message}${progress === null ? "" : ` (${progress}%)`}`);
    closeButton.type = "button";
    closeButton.className = "btn-close btn-close-white me-2 m-auto";
    closeButton.dataset.bsDismiss = "toast";
    content.append(body, closeButton);
    toast.appendChild(content);
    document.getElementById("taskToastContainer").appendChild(toast);
    const instance = new bootstrap.Toast(toast, { delay: type === "info" ? 2500 : 5000 });
    instance.show();
    toast.addEventListener("hidden.bs.toast", () => toast.remove());
}

async function pollVmwareTask(taskId) {
    showTaskToast("VMware action running...", "info");
    while (true) {
        const result = await fetchJson(`/api/tasks/${encodeURIComponent(taskId)}`);
        const task = result.data;
        if (task.state === "success") {
            showTaskToast("VMware action completed", "success", task.progress);
            return task;
        }
        if (task.state === "error") {
            showTaskToast(task.error || "VMware action failed", "danger");
            throw new Error(task.error || "VMware action failed");
        }
        showTaskToast(`VMware action ${task.state}`, "info", task.progress);
        await new Promise(resolve => setTimeout(resolve, 2000));
    }
}

async function runTaskAction(action) {
    const response = await action();
    const taskId = response.task_id || response.task;
    if (!taskId) throw new Error("VMware task ID was not returned");
    return pollVmwareTask(taskId);
}

const powerConfirmModal = new bootstrap.Modal(
    document.getElementById("powerConfirmModal")
);

function updateRefreshCountdown() {
    document.getElementById("refresh-countdown").innerText =
        `${secondsUntilRefresh}s`;
}

function getStatusBadgeClass(status) {
    if (status.includes("Running")) return "bg-success";
    if (status.includes("Stopped") || status.includes("Powered Off")) return "bg-danger";
    if (status.includes("Suspended")) return "bg-warning text-dark";
    return "bg-secondary";
}

function getActionState(powerState) {
    const baseActions = [
        { action: "powerOn", label: "Power On", color: "success" },
        { action: "powerOff", label: "Power Off", color: "danger" },
        { action: "reset", label: "Reset", color: "warning" },
        { action: "shutdown", label: "Shutdown Guest", color: "info" },
        { action: "suspend", label: "Suspend", color: "secondary" },
        { action: "snapshot", label: "Snapshot", color: "primary" }
    ];

    if (powerState === "poweredOn") {
        return baseActions.map(a => ({
            ...a,
            disabled: a.action === "powerOn"
        }));
    }
    if (powerState === "poweredOff") {
        return baseActions.map(a => ({
            ...a,
            disabled: ["powerOff", "reset", "shutdown", "suspend"].includes(a.action)
        }));
    }
    return baseActions.map(a => ({ ...a, disabled: a.action !== "snapshot" }));
}

function renderVmActions() {
    document.querySelectorAll(".vm-actions").forEach(container => {
        const vmId = container.dataset.vmId;
        const powerState = container.dataset.powerState;
        const actions = getActionState(powerState);

        const dropdown = document.createElement("div");
        const toggle = document.createElement("button");
        const menu = document.createElement("ul");

        dropdown.className = "dropdown";
        toggle.type = "button";
        toggle.className = "btn btn-sm btn-primary dropdown-toggle";
        toggle.dataset.bsToggle = "dropdown";
        toggle.innerText = "Action";
        menu.className = "dropdown-menu";

        actions.forEach(action => {
            const item = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.className = `dropdown-item text-${action.color}`;
            button.dataset.vmId = vmId;
            button.dataset.vmAction = action.action;
            button.disabled = action.disabled;
            if (action.disabled) button.classList.add("disabled");
            button.innerText = action.label;
            item.appendChild(button);
            menu.appendChild(item);
        });

        dropdown.append(toggle, menu);
        container.replaceChildren(dropdown);
    });
}

function filterVmRows() {
    const query = document.getElementById("vm-search").value.toLowerCase();
    document.querySelectorAll("#vm-table tr").forEach(row => {
        const name = row.cells[0].innerText.toLowerCase();
        const status = row.cells[1].innerText;
        const matchesStatus = statusFilter === "all" ||
            (statusFilter === "running" && status.includes("Running")) ||
            (statusFilter === "stopped" &&
                (status.includes("Stopped") || status.includes("Powered Off")));
        row.style.display = name.includes(query) && matchesStatus ? "" : "none";
    });
    document.querySelectorAll("#vm-mobile-list .vm-mobile-card").forEach(card => {
        const name = card.querySelector(".card-title").innerText.toLowerCase();
        const status = card.querySelector(".vm-mobile-status").innerText;
        const matchesStatus = statusFilter === "all" ||
            (statusFilter === "running" && status.includes("Running")) ||
            (statusFilter === "stopped" &&
                (status.includes("Stopped") || status.includes("Powered Off")));
        card.style.display = name.includes(query) && matchesStatus ? "" : "none";
    });
}

function setActiveVmFilterCard(activeCard) {
    document.querySelectorAll("[data-vm-filter]").forEach(card => {
        card.classList.remove("border-primary", "border-2", "shadow-sm");
    });
    activeCard.classList.add("border-primary", "border-2", "shadow-sm");
}

function updateVmStatusSummary() {
    const rows = document.querySelectorAll("#vm-table tr");
    const running = Array.from(rows).filter(row =>
        row.cells[1].innerText.includes("Running")
    ).length;
    document.getElementById("vm-total").innerText = rows.length;
    document.getElementById("vm-running").innerText = running;
    document.getElementById("vm-stopped").innerText = rows.length - running;
}

function renderVmRows(vms) {
    const tableBody = document.getElementById("vm-table");
    const mobileList = document.getElementById("vm-mobile-list");
    tableBody.innerHTML = "";
    mobileList.innerHTML = "";

    vms.forEach(vm => {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        const statusCell = document.createElement("td");
        const cpuCell = document.createElement("td");
        const memoryCell = document.createElement("td");
        const ipCell = document.createElement("td");
        const guestCell = document.createElement("td");
        const hostCell = document.createElement("td");
        const uptimeCell = document.createElement("td");
        const actionCell = document.createElement("td");
        const badge = document.createElement("span");
        const actionContainer = document.createElement("div");
        const memoryMb = Number(vm.memory);
        const memoryGb = memoryMb / 1024;

        nameCell.innerText = vm.name;
        badge.className = `badge ${getStatusBadgeClass(vm.status)}`;
        badge.innerText = vm.status;
        statusCell.appendChild(badge);

        cpuCell.innerText = vm.cpu && vm.cpu !== "--" ? `${vm.cpu} vCPU` : "--";
        memoryCell.innerText = Number.isFinite(memoryGb)
            ? `${Number.isInteger(memoryGb) ? memoryGb : memoryGb.toFixed(1)} GB`
            : "--";
        ipCell.innerText = vm.ip || "--";
        guestCell.innerText = vm.guest || "--";
        hostCell.innerText = vm.host || "--";
        uptimeCell.innerText = vm.uptime || "--";

        actionContainer.className = "vm-actions";
        actionContainer.dataset.vmId = vm.id;
        actionContainer.dataset.powerState = vm.power_state;
        actionCell.appendChild(actionContainer);

        row.append(
            nameCell,
            statusCell,
            cpuCell,
            memoryCell,
            ipCell,
            guestCell,
            hostCell,
            uptimeCell,
            actionCell
        );
        tableBody.appendChild(row);

        const card = document.createElement("div");
        card.className = "card mb-3 vm-mobile-card";
        card.innerHTML = `
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
                    <div><h5 class="card-title mb-1"></h5><span class="vm-mobile-status badge"></span></div>
                    <div class="vm-actions"></div>
                </div>
                <div class="row g-2 small">
                    <div class="col-6"><strong>CPU</strong><div class="vm-mobile-cpu vm-mobile-value"></div></div>
                    <div class="col-6"><strong>Memory</strong><div class="vm-mobile-memory vm-mobile-value"></div></div>
                    <div class="col-6"><strong>Storage</strong><div class="vm-mobile-storage vm-mobile-value"></div></div>
                    <div class="col-6"><strong>IP</strong><div class="vm-mobile-ip vm-mobile-value"></div></div>
                    <div class="col-6"><strong>Guest OS</strong><div class="vm-mobile-guest vm-mobile-value"></div></div>
                    <div class="col-6"><strong>Host</strong><div class="vm-mobile-host vm-mobile-value"></div></div>
                    <div class="col-6"><strong>Uptime</strong><div class="vm-mobile-uptime vm-mobile-value"></div></div>
                </div>
            </div>`;
        card.querySelector(".card-title").innerText = vm.name;
        const mobileActionContainer = card.querySelector(".vm-actions");
        mobileActionContainer.dataset.vmId = vm.id;
        mobileActionContainer.dataset.vmName = vm.name;
        mobileActionContainer.dataset.powerState = vm.power_state;
        const status = card.querySelector(".vm-mobile-status");
        status.className = `vm-mobile-status badge ${getStatusBadgeClass(vm.status)}`;
        status.innerText = vm.status;
        card.querySelector(".vm-mobile-cpu").innerText = vm.cpu && vm.cpu !== "--" ? `${vm.cpu} vCPU` : "--";
        const mobileMemoryMb = Number(vm.memory_mb ?? vm.memory);
        card.querySelector(".vm-mobile-memory").innerText = Number.isFinite(mobileMemoryMb) ? `${(mobileMemoryMb / 1024).toFixed(1)} GB` : "--";
        card.querySelector(".vm-mobile-storage").innerText = vm.provisioned_storage_gb === undefined
            ? "--" : `${vm.used_storage_gb} / ${vm.provisioned_storage_gb} GB used`;
        card.querySelector(".vm-mobile-ip").innerText = vm.ip_address || vm.ip || "--";
        card.querySelector(".vm-mobile-guest").innerText = vm.guest_os || vm.guest || "--";
        card.querySelector(".vm-mobile-host").innerText = vm.host || "--";
        card.querySelector(".vm-mobile-uptime").innerText = vm.uptime || "--";
        mobileList.appendChild(card);
    });

    renderVmActions();
    updateVmStatusSummary();
    filterVmRows();
}

function renderAlerts(alerts) {
    const alertCount = document.getElementById("alert-count");
    const alertList = document.getElementById("alert-list");
    const systemHealth = document.getElementById("system-health");
    const criticalAlerts = alerts.filter(alert => alert.severity === "critical");

    alertCount.innerText = alerts.length;
    alertList.innerHTML = "";

    if (alerts.length === 0) {
        alertCount.className = "badge text-bg-success";
        systemHealth.className = "badge text-bg-success";
        systemHealth.innerText = "🟢 System Health: Healthy (0 alerts)";
        const emptyMessage = document.createElement("span");
        emptyMessage.className = "text-success";
        emptyMessage.innerText = "No active alerts";
        alertList.appendChild(emptyMessage);
        return;
    }

    if (criticalAlerts.length > 0) {
        alertCount.className = "badge text-bg-danger";
        systemHealth.className = "badge text-bg-danger";
        systemHealth.innerText =
            `🔴 System Health: Critical (${alerts.length} alerts)`;
    } else {
        alertCount.className = "badge text-bg-warning";
        systemHealth.className = "badge text-bg-warning";
        systemHealth.innerText =
            `🟡 System Health: Warning (${alerts.length} alerts)`;
    }

    const list = document.createElement("div");
    list.className = "list-group list-group-flush";

    alerts.forEach(alert => {
        const item = document.createElement("div");
        const severity = document.createElement("span");
        const source = document.createElement("strong");

        item.className = "list-group-item px-0";
        severity.className = alert.severity === "critical"
            ? "badge text-bg-danger me-2"
            : "badge text-bg-warning me-2";
        severity.innerText = alert.severity;
        source.innerText = `${alert.source}: `;

        item.append(severity, source, alert.message);
        list.appendChild(item);
    });

    alertList.appendChild(list);
}

function renderDockerStatus(containers) {
    const container = document.getElementById("docker-status-list");
    container.innerHTML = "";

    if (!Array.isArray(containers) || containers.length === 0) {
        container.innerHTML = '<span class="text-muted">No Docker containers found</span>';
        return;
    }

    const list = document.createElement("div");
    list.className = "list-group list-group-flush";

    containers.forEach(item => {
        const row = document.createElement("div");
        const badge = document.createElement("span");
        const name = document.createElement("strong");
        const status = item.status || "unavailable";
        const running = status === "running";

        row.className = "list-group-item px-0";
        badge.className = running
            ? "badge text-bg-success me-2"
            : "badge text-bg-secondary me-2";
        badge.innerText = running ? "🟢" : "🔴";
        name.innerText = item.name || "Unknown";

        row.append(badge, name, document.createElement("br"));
        row.append(`Status: ${running ? "Running" : status}`);
        list.appendChild(row);
    });

    container.appendChild(list);
}

async function refreshDockerStatus() {
    try {
        const response = await fetch("/api/docker");
        const data = await response.json();
        if (!response.ok || data.success !== true) {
            throw new Error(data.detail || "Docker status unavailable");
        }
        renderDockerStatus(data.data);
    } catch (error) {
        const container = document.getElementById("docker-status-list");
        container.innerHTML = '<span class="text-muted">Docker status unavailable</span>';
    }
}

function updateDashboardValues(data) {
    document.getElementById("cpu").innerText = `${data.summary.cpu} %`;
    document.getElementById("memory").innerText = `${data.summary.memory} %`;
    document.getElementById("datastore").innerText = `${data.summary.datastore} %`;
    document.getElementById("last-refresh").innerText = data.updated.summary;
    if (data.hardware) {
        document.getElementById("power").innerText = `${data.hardware.power.watt} W`;
        document.getElementById("temp-cpu").innerText = `${data.hardware.temperature.cpu} °C`;
        document.getElementById("temp-ambient").innerText = `${data.hardware.temperature.ambient} °C`;
        document.getElementById("temp-storage").innerText = `${data.hardware.temperature.storage} °C`;
    }
}

async function refreshDashboard() {
    try {
        const response = await fetch("/api/dashboard");
        if (!response.ok) throw new Error("Dashboard refresh failed");
        const data = await response.json();
        updateDashboardValues(data);
        renderVmRows(data.vm);
        renderAlerts(data.alerts || []);
        await refreshDockerStatus();
        secondsUntilRefresh = refreshInterval;
        updateRefreshCountdown();
    } catch (error) {
        console.error(error);
    }
}

async function executePowerAction() {
    if (!selectedPowerAction) return;
    const { vmId, action, button } = selectedPowerAction;
    button.disabled = true;
    try {
        await runTaskAction(() => vmActionApi[action](vmId));
        powerConfirmModal.hide();
        await refreshDashboard();
    } catch (error) {
        alert(error.message);
        button.disabled = false;
    }
}

document.getElementById("confirmPowerAction").addEventListener("click", executePowerAction);
function handleVmActionClick(event) {
    const button = event.target.closest("[data-vm-action]");
    if (!button) return;
    if (button.disabled) return;
    if (button.dataset.vmAction === "snapshot") {
        const row = button.closest("tr");
        const card = button.closest(".vm-mobile-card");
        const vmName = button.dataset.vmName ||
            (row ? row.cells[0].innerText : card.querySelector(".card-title").innerText);
        openSnapshotModal(button.dataset.vmId, vmName);
        return;
    }
    selectedPowerAction = {
        vmId: button.dataset.vmId,
        action: button.dataset.vmAction,
        button
    };
    document.getElementById("powerConfirmMessage").innerText =
        `Are you sure you want to ${selectedPowerAction.action} this virtual machine?`;
    powerConfirmModal.show();
}

document.getElementById("vm-table").addEventListener("click", handleVmActionClick);
document.getElementById("vm-mobile-list").addEventListener("click", handleVmActionClick);

const snapshotModal = new bootstrap.Modal(document.getElementById("snapshotModal"));
const snapshotConfirmModal = new bootstrap.Modal(document.getElementById("snapshotConfirmModal"));
let selectedSnapshotVm = null;
let pendingSnapshotConfirmation = null;
let snapshotControlsBusy = false;

function setSnapshotControlsBusy(isBusy) {
    snapshotControlsBusy = isBusy;
    ["createSnapshot", "restoreSnapshot", "deleteSnapshot"].forEach(id => {
        document.getElementById(id).disabled = isBusy;
    });
    document.getElementById("snapshotList").disabled = isBusy;
    document.getElementById("snapshotName").disabled = isBusy;
}

function updateSnapshotSelectionState() {
    const hasSelection = !snapshotControlsBusy && Boolean(document.getElementById("snapshotList").value);
    document.getElementById("restoreSnapshot").disabled = !hasSelection;
    document.getElementById("deleteSnapshot").disabled = !hasSelection;
}

async function loadSnapshots() {
    const result = await snapshotApi.list(selectedSnapshotVm.id);
    const select = document.getElementById("snapshotList");
    select.innerHTML = "";
    if (!result.data.length) {
        select.innerHTML = '<option value="">No snapshots</option>';
    } else {
        result.data.forEach(snapshot => {
            const option = document.createElement("option");
            option.value = snapshot.id;
            option.dataset.snapshotName = snapshot.name;
            option.innerText = snapshot.description
                ? `${snapshot.name} - ${snapshot.description}`
                : snapshot.name;
            select.appendChild(option);
        });
    }
    document.getElementById("snapshotMessage").innerText = `${result.data.length} snapshot(s)`;
    updateSnapshotSelectionState();
}

async function openSnapshotModal(vmId, vmName) {
    selectedSnapshotVm = { id: vmId, name: vmName };
    document.getElementById("snapshotVmName").innerText = vmName;
    snapshotModal.show();
    try { await loadSnapshots(); } catch (error) { showTaskToast(error.message, "danger"); }
}

async function snapshotTask(operation) {
    setSnapshotControlsBusy(true);
    try {
        const response = await operation();
        await pollVmwareTask(response.task_id);
        await loadSnapshots();
    } catch (error) {
        showTaskToast(error.message, "danger");
    } finally {
        setSnapshotControlsBusy(false);
        updateSnapshotSelectionState();
    }
}

function confirmSnapshotAction(message, action) {
    document.getElementById("snapshotConfirmMessage").innerText = message;
    pendingSnapshotConfirmation = action;
    snapshotConfirmModal.show();
}

document.getElementById("confirmSnapshotAction").addEventListener("click", () => {
    const action = pendingSnapshotConfirmation;
    pendingSnapshotConfirmation = null;
    snapshotConfirmModal.hide();
    if (action) action();
});

document.getElementById("snapshotList").addEventListener("change", updateSnapshotSelectionState);

document.getElementById("createSnapshot").addEventListener("click", () => {
    let name = document.getElementById("snapshotName").value.trim();
    if (!name) {
        const now = new Date();
        const pad = value => String(value).padStart(2, "0");
        name = `Snapshot-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-` +
            `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }
    snapshotTask(() => snapshotApi.create(selectedSnapshotVm.id, { name }));
});
document.getElementById("restoreSnapshot").addEventListener("click", () => {
    const select = document.getElementById("snapshotList");
    const id = select.value;
    if (id) {
        const name = select.options[select.selectedIndex].dataset.snapshotName;
        confirmSnapshotAction(`Restore snapshot '${name}'?`, () =>
            snapshotTask(() => snapshotApi.restore(selectedSnapshotVm.id, id))
        );
    }
});
document.getElementById("deleteSnapshot").addEventListener("click", () => {
    const select = document.getElementById("snapshotList");
    const id = select.value;
    if (id) {
        const name = select.options[select.selectedIndex].dataset.snapshotName;
        confirmSnapshotAction(`Delete snapshot '${name}'?`, () =>
            snapshotTask(() => snapshotApi.remove(selectedSnapshotVm.id, id))
        );
    }
});
document.getElementById("vm-search").addEventListener("input", filterVmRows);
document.querySelectorAll("[data-vm-filter]").forEach(card => {
    card.addEventListener("click", () => {
        statusFilter = card.dataset.vmFilter;
        setActiveVmFilterCard(card);
        filterVmRows();
    });
});

setActiveVmFilterCard(document.querySelector('[data-vm-filter="all"]'));
renderVmActions();
updateVmStatusSummary();
updateRefreshCountdown();
refreshDashboard();
setInterval(() => {
    secondsUntilRefresh = Math.max(secondsUntilRefresh - 1, 0);
    updateRefreshCountdown();
}, 1000);
setInterval(refreshDashboard, refreshInterval * 1000);
</script>
