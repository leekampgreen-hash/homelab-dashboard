version: "3.9"

services:

  dashboard:

    build: .

    container_name: dashboard

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./app:/app


  collector:

    build: .

    container_name: collector

    restart: unless-stopped

    command: python collector.py

    env_file:
      - .env

    volumes:
      - ./app:/app
      - ./data:/app/data


  docker-monitor:

    build: .

    container_name: docker-monitor

    restart: unless-stopped

    command: uvicorn docker_monitor:app --host 0.0.0.0 --port 9000

    expose:
      - "9000"

    volumes:
      - ./app:/app
      - /var/run/docker.sock:/var/run/docker.sock


  telegram-bot:

    build: .

    container_name: telegram-bot

    restart: unless-stopped

    command: python telegram/bot.py

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    volumes:
      - ./app:/app
      - ./data:/app/data
